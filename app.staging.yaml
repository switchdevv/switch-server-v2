# Staging: separate GCP project and Atlas cluster (OD-1). Deployed by
# .github/workflows/deploy-staging.yml (docs/05-staging.md); the rest of the config is .env.staging.
runtime: nodejs24
instance_class: F1
entrypoint: node --enable-source-maps dist/main.js
inbound_services:
  - warmup
env_variables:
  APP_ENV: staging
automatic_scaling:
  # Scales to zero when idle, so it costs nothing between test sessions. The dispatch worker only
  # runs while an instance is up: set 1 while testing automatic dispatch rounds.
  min_instances: 0
  max_instances: 5
  max_concurrent_requests: 70
  target_cpu_utilization: 0.9
  target_throughput_utilization: 0.9
  min_pending_latency: 30ms
  max_pending_latency: automatic
