# Production (switch-proj, same service as legacy). Deployed with --no-promote only; traffic moves
# are the manual runbook steps (plan §10). Scaling mirrors legacy so capacity is identical at cutover.
runtime: nodejs24
instance_class: F2 # OD-8, confirmed by the Phase 4 load test
entrypoint: node --enable-source-maps dist/main.js
inbound_services:
  - warmup
env_variables:
  APP_ENV: production
automatic_scaling:
  min_instances: 1
  max_instances: 5
  target_cpu_utilization: 0.9
  max_concurrent_requests: 70
  target_throughput_utilization: 0.9
  min_pending_latency: 30ms
  max_pending_latency: automatic
