# Production: a version of switch-proj's `default` service, next to legacy's. Deployed with
# --no-promote only (.github/workflows/deploy-production.yml); traffic moves are the manual promote
# workflow (docs/06-production.md). The rest of the config is .env.prod.
runtime: nodejs24
instance_class: F2 # OD-8, confirmed by the Phase 4 load test
entrypoint: node --enable-source-maps dist/main.js
inbound_services:
  - warmup
env_variables:
  APP_ENV: production
automatic_scaling:
  # Legacy has min_instances: 1. Here the floor is an idle instance instead, which App Engine only
  # keeps for the version with most of the traffic. min_instances would keep an instance, and its
  # dispatch worker, on every version deployed without traffic or kept for rollback, running
  # unreleased or old code against the production database.
  min_instances: 0
  min_idle_instances: 1
  max_instances: 5
  target_cpu_utilization: 0.9
  max_concurrent_requests: 70
  target_throughput_utilization: 0.9
  min_pending_latency: 30ms
  max_pending_latency: automatic
